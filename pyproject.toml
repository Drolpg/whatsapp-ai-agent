[project]
name = "whatsapp-ai-agent"
version = "0.1.0"
description = "Agente de IA para atendimento via WhatsApp (Twilio Agent Connect), com RAG local e handoff para o Flex."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.15.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "adapters"]
